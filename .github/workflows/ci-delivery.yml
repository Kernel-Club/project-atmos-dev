name: CI-Delivery

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  APP_VERSION: v1.0.0
  K8S_REPO: Kernel-Club/project-atmos-k8s

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: ruff check .

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

  delivery:
    # The image is built once. It is published and handed over to the k8s
    # repository only on a push to develop; elsewhere it is only built.
    name: Build, tag, push and trigger k8s
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=${APP_VERSION}-${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: streetflow13/project-atmos-backend:${{ env.IMAGE_TAG }}

      - name: Build, tag and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: streetflow13/project-atmos-frontend:${{ env.IMAGE_TAG }}

      - name: Trigger k8s repo pipeline
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
        run: |
          gh api "repos/${K8S_REPO}/dispatches" \
            -f event_type=deploy \
            -f "client_payload[image_tag]=${IMAGE_TAG}"
