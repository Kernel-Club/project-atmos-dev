name: CD

on:
  # Automatic DEV deployment after a successful CI run on develop
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

  # Manual PROD promotion (requires approval of the "production" environment)
  workflow_dispatch:
    inputs:
      version:
        description: "App version in the DEV image tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      sha:
        description: "First 6 characters of the commit SHA in the DEV image tag"
        required: true

permissions:
  contents: read

env:
  # Must match APP_VERSION in ci.yml
  APP_VERSION: v1.0.0

jobs:
  deploy-dev:
    name: Deploy DEV
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment: development

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    env:
      AWS_REGION: ap-northeast-2
      EKS_CLUSTER_NAME: project-atmos-eks
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Set image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=dev-${APP_VERSION}-${HEAD_SHA:0:6}" >> "$GITHUB_ENV"
          echo "Deploying commit: $HEAD_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v4
        with:
          repository: Kernel-Club/project-atmos-k8s
          ref: main
          path: project-atmos-k8s
          persist-credentials: false

      - name: Set image tags in DEV overlay
        working-directory: project-atmos-k8s/overlays/dev
        run: |
          kustomize edit set image \
            "streetflow13/project-atmos-backend=streetflow13/project-atmos-backend:$IMAGE_TAG" \
            "streetflow13/project-atmos-frontend=streetflow13/project-atmos-frontend:$IMAGE_TAG"

      - name: Validate rendered manifests
        run: |
          kubectl kustomize project-atmos-k8s/overlays/dev | grep "image:"

      - name: Apply DEV manifests
        run: |
          kubectl apply -k project-atmos-k8s/overlays/dev

      - name: Verify backend rollout
        run: |
          kubectl rollout status deployment/atmos-backend \
            --namespace dev \
            --timeout=180s

      - name: Verify frontend rollout
        run: |
          kubectl rollout status deployment/atmos-frontend \
            --namespace dev \
            --timeout=180s

      - name: Show diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n dev || true
          kubectl get events -n dev --sort-by=.lastTimestamp | tail -20 || true

      - name: Show deployment status
        if: always()
        run: |
          kubectl get deployments -n dev \
            -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,IMAGES:.spec.template.spec.containers[*].image' \
            || true

  promote-prod:
    # Adds a prod-* tag to the image that already passed DEV. No rebuild.
    name: Promote image to PROD
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $VERSION"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{6}$ ]] || { echo "Bad sha (need 6 hex chars): $SHA"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote backend and frontend images
        shell: bash
        run: |
          for SERVICE in backend frontend; do
            SRC="streetflow13/project-atmos-${SERVICE}:dev-${VERSION}-${SHA}"
            DST="streetflow13/project-atmos-${SERVICE}:prod-${VERSION}-${SHA}"
            echo "Promoting $SRC -> $DST"
            docker buildx imagetools create --tag "$DST" "$SRC"
          done
